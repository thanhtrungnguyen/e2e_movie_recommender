version = 1
revision = 2
requires-python = ">=3.13"

[manifest]
members = [
    "common",
    "e2e-movie-recommender",
    "interact",
    "recommend",
    "spark",
]

[[package]]
name = "common"
version = "0.1.0"
source = { virtual = "libs/common" }

[[package]]
name = "e2e-movie-recommender"
version = "0.1.0"
source = { virtual = "." }

[[package]]
name = "interact"
version = "0.1.0"
source = { virtual = "api/interact" }

[[package]]
name = "recommend"
version = "0.1.0"
source = { virtual = "api/recommend" }

[[package]]
name = "spark"
version = "0.1.0"
source = { virtual = "spark" }
